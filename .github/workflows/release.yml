# Publica uma release (rascunho) com os instaladores de Windows e Linux.
# Disparo: `git tag v0.1.0 && git push origin v0.1.0`, ou manualmente na aba Actions.
#
# Assinatura do Windows (SignPath Foundation, grátis para open source): liga sozinha quando as
# variáveis SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG e SIGNPATH_SIGNING_POLICY_SLUG e o
# segredo SIGNPATH_API_TOKEN existem no repositório. Sem elas, os instaladores saem sem assinatura.
# O executável é assinado antes de entrar nos instaladores, e os instaladores depois; cada pedido
# espera a aprovação manual no SignPath. Configurações dos artefatos em .signpath/.
#
# Atualização automática: com o segredo TAURI_SIGNING_PRIVATE_KEY (a chave privada do updater,
# par da `pubkey` do tauri.conf.json), cada instalador sai com um .sig e o job `updater` monta o
# latest.json. O app lê o latest.json da última release publicada: o rascunho não chega a ninguém.
#
# Tempo: o cache do Rust de uma tag não serve para a próxima (o GitHub isola o cache por ref), então
# o cache.yml compila na main e os jobs daqui só leem o cache dela (`shared-key` igual).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Só leitura por padrão; cada job pede o que precisa.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # cria a release e envia os arquivos
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: tag
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_type == 'tag' && github.ref_name || 'v$version' }}" >> "$GITHUB_OUTPUT"

      - name: Release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes="Instaladores para Windows (.msi / -setup.exe) e Linux (.deb / .rpm / .AppImage)."
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            notes+="

          Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/) — see the [code signing policy](https://github.com/${{ github.repository }}#política-de-assinatura-de-código-code-signing-policy)."
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Nexo $TAG" --notes "$notes"

  linux:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write # cria a release e envia os arquivos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf rpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release-linux
          save-if: false

      - run: npm ci

      - run: npx tauri build

      - name: Envia para a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd src-tauri/target/release/bundle
          files=(deb/*.deb rpm/*.rpm appimage/*.AppImage)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in "${files[@]}"; do npx tauri signer sign --app-version "$VERSION" "$f"; done
            files+=("${files[@]/%/.sig}")
          fi
          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber

  windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write # cria a release e envia os arquivos
      actions: read # a SignPath baixa os artefatos do run
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release-windows
          save-if: false

      - run: npm ci

      - name: Compila (sem instaladores)
        run: npx tauri build --no-bundle

      # 1. O executável, que vai dentro dos dois instaladores.
      - name: Executável para assinar
        if: env.SIGN == 'true'
        id: exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexo-exe
          path: src-tauri/target/release/nexo.exe
          if-no-files-found: error

      - name: Assina o executável
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: executable
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.release.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/exe

      - name: Usa o executável assinado
        if: env.SIGN == 'true'
        run: Copy-Item signed/exe/nexo.exe src-tauri/target/release/nexo.exe -Force

      - name: Instaladores
        run: npx tauri bundle --bundles msi,nsis

      # 2. Os instaladores.
      - name: Instaladores para assinar
        if: env.SIGN == 'true'
        id: installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexo-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Assina os instaladores
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.release.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installers

      - name: Envia para a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          if [ "$SIGN" = true ]; then
            files=(signed/installers/msi/*.msi signed/installers/nsis/*-setup.exe)
          else
            files=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*-setup.exe)
          fi
          # Depois da SignPath: a assinatura do updater cobre o arquivo final.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in "${files[@]}"; do npx tauri signer sign --app-version "$VERSION" "$f"; done
            files+=("${files[@]/%/.sig}")
          fi
          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber

  # latest.json: a versão e, por tipo de instalação, o arquivo e a assinatura. O app procura
  # `{os}-{arch}-{instalador}` (nsis, msi, deb, rpm, appimage) e, sem achar, `{os}-{arch}`.
  updater:
    needs: [release, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # cria a release e envia os arquivos
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Monta e envia o latest.json
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs || true
          if ! ls sigs/*.sig >/dev/null 2>&1; then
            echo "::warning::Sem assinaturas do updater (segredo TAURI_SIGNING_PRIVATE_KEY ausente): latest.json não gerado."
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            local sig=(sigs/$1.sig)
            [ -f "${sig[0]}" ] || { echo null; return; }
            jq -n --rawfile sig "${sig[0]}" --arg url "$base/$(basename "${sig[0]}" .sig)" \
              '{signature: ($sig | rtrimstr("\n")), url: $url}'
          }
          nsis=$(entry '*-setup.exe') msi=$(entry '*.msi')
          appimage=$(entry '*.AppImage') deb=$(entry '*.deb') rpm=$(entry '*.rpm')
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)" \
            --argjson nsis "$nsis" --argjson msi "$msi" \
            --argjson appimage "$appimage" --argjson deb "$deb" --argjson rpm "$rpm" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: ({
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi,
              "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage,
              "linux-x86_64-deb": $deb, "linux-x86_64-rpm": $rpm
            } | with_entries(select(.value != null)))}' > latest.json
          cat latest.json
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" latest.json --clobber
