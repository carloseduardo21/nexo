[package]
name = "nexo"
version = "0.2.0"
description = "Nexo — terminal SSH/RDP rápido e multiplataforma"
edition = "2021"

[lib]
name = "nexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# `ring` em vez de `aws-lc-rs`: compila no Windows sem precisar de CMake/NASM.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
tokio = { version = "1.54.1", features = ["net", "sync", "time", "io-util", "macros", "fs"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
uuid = { version = "1.29.0", features = ["v4"] }
sha2 = "0.10"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
# RDP (IronRDP). Mesmo conjunto de versões em todas as crates: elas compartilham tipos.
ironrdp-connector = "0.11"
ironrdp-session = "0.12"
ironrdp-tokio = "0.11"
ironrdp-tls = { version = "0.3", features = ["rustls-ring"] }
ironrdp-graphics = "0.10"
ironrdp-pdu = "0.10"
ironrdp-core = "0.3"
ironrdp-dvc = "0.9"
ironrdp-svc = "0.9"
ironrdp-displaycontrol = "0.9"
ironrdp-input = "0.8"
ironrdp-cliprdr = "0.8"
ironrdp-egfx = { version = "0.4", features = ["openh264-bundled"] }
arboard = { version = "3.7", default-features = false }
# Kubernetes: cliente oficial em Rust (lê o kubeconfig, inclusive plugins `exec` de autenticação).
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
http = "1"
serde-saphyr = "0.0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Dependências (russh, crypto, tokio) otimizadas mesmo no `tauri dev`: o primeiro build
# demora mais, mas o app em desenvolvimento fica com o desempenho real.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
